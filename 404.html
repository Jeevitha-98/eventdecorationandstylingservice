<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly | Blueprint Deviation (404 Error)</title>
    <link rel="stylesheet" href="404.css">
</head>
<body class="error-canvas-body">

    <!-- Creative Immersive Glassmorphic Frame Box Window Container -->
    <div class="error-master-box-wrapper">
        
        <!-- Large Aesthetic Spatial Backdrop Token (Directly from reference architecture vectors) -->
        <div class="error-geometric-token">
            <span class="token-number-glitch">404</span>
            <div class="token-offset-backing"></div>
        </div>

        <div class="error-content-narrative">
            <span class="error-mini-badge">Blueprint Deviation</span>
            <h2>Concept Coordinates Missing</h2>
            <p>The layout path or design module you are tracking has either shifted scales or hasn't loaded onto our production servers yet. Let's redirect your browser session safely.</p>
        </div>

        <!-- Symmetrical Action Navigation Controls Row -->
        <div class="error-action-controls-row">
            <!-- Custom dynamic scroll-snapping history anchor button -->
            <button class="err-btn btn-outline-peach" id="historyBackBtn">
                <span class="btn-arrow-vector">←</span> Return to Previous Section
            </button>
            
            <!-- Standard index home route button link -->
            <button class="err-btn btn-solid-dark" onclick="window.location.href='index.html'">
                Navigate to Home Hub
            </button>
        </div>

    </div>

    <!-- High-Performance History Tracking Core Architecture Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const historyBackBtn = document.getElementById("historyBackBtn");

            if (historyBackBtn) {
                historyBackBtn.addEventListener("click", () => {
                    // Pull the exact routing document reference from history states matrix log parameters
                    if (document.referrer) {
                        // Native browser window navigation routing trace loops straight back to the previous file
                        window.location.href = document.referrer;
                    } else {
                        // Fallback safety catch-all escape hatch if no direct historical trace records exist
                        window.history.back();
                    }
                });
            }
        });
    </script>

    <style>
        /* --- High-Quality Layout Backing Variables & Resets --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.error-canvas-body {
    background-color: #FFF8F6; /* Standard Stackly pale pink canvas base theme background */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
}

/* ==========================================================================
   GLASSMORPHIC FRAME EMBED ARCHITECTURE
   ========================================================================== */
.error-master-box-wrapper {
    background-color: #FFFFFF;
    border: 1px solid rgba(232, 153, 141, 0.2);
    border-radius: 24px;
    padding: 60px 48px;
    max-width: 580px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(93, 74, 71, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
    animation: entrancePop 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

@keyframes entrancePop {
    from { opacity: 0; transform: scale(0.96) translateY(15px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

/* --- Geometric Graphic Accent Token Layer --- */
.error-geometric-token {
    position: relative;
    margin-bottom: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.token-number-glitch {
    font-size: 6.5rem;
    font-weight: 900;
    color: #1A1A1A; /* Solid Deep Slate Near Black */
    line-height: 1;
    letter-spacing: -3px;
    position: relative;
    z-index: 3;
    user-select: none;
}

.token-offset-backing {
    position: absolute;
    width: 140px;
    height: 75px;
    background-color: #FFEBE5; /* Soft Peach branding backdrop block matched from photo frames */
    border-radius: 12px;
    z-index: 1;
    transform: rotate(-6deg) translate(-10px, 4px);
    opacity: 0.85;
}

/* --- Narrative Text Block Components --- */
.error-content-narrative {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
}

.error-mini-badge {
    display: inline-block;
    padding: 6px 14px;
    background-color: #FFF0EC;
    color: #E8998D; /* Signature Primary Brand Peach Accent Color */
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 30px;
    margin-bottom: 18px;
}

.error-content-narrative h2 {
    font-size: 2rem;
    font-weight: 800;
    color: #111111;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.error-content-narrative p {
    font-size: 1rem;
    line-height: 1.6;
    color: #5D4A47;
    max-width: 440px;
}

/* ==========================================================================
   SYMMETRICAL ACTION BUTTONS CONTROLS DESIGN
   ========================================================================== */
.error-action-controls-row {
    display: flex;
    gap: 16px;
    width: 100%;
}

.err-btn {
    flex: 1;
    padding: 16px 24px;
    font-size: 0.92rem;
    font-weight: 700;
    border-radius: 12px; /* Pillow-curved soft layout block border radius dimensions */
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s, box-shadow 0.3s ease;
}

.btn-outline-peach {
    background-color: transparent;
    border: 2px solid rgba(232, 153, 141, 0.4);
    color: #1A1A1A;
}

.btn-outline-peach:hover {
    border-color: #E8998D;
    background-color: #FFF8F6;
    color: #E8998D;
}

.btn-solid-dark {
    background-color: #0F141C; /* Dark luxury solid slate color precisely matched from signup panels */
    border: none;
    color: #FFFFFF;
    box-shadow: 0 4px 15px rgba(15, 20, 28, 0.1);
}

.btn-solid-dark:hover {
    background-color: #E8998D; /* Swaps instantly to active primary peach focus accent coloring fields */
    box-shadow: 0 8px 25px rgba(232, 153, 141, 0.35);
    transform: translateY(-2px);
}

.err-btn:active {
    transform: scale(0.99) translateY(0);
}

.btn-arrow-vector {
    display: inline-block;
    transition: transform 0.2s ease;
}
.btn-outline-peach:hover .btn-arrow-vector {
    transform: translateX(-3px);
}

/* ==========================================================================
   FULLY SMOOTH RESPONSIVE BREAKPOINT ADAPTER OVERRIDES
   ========================================================================== */
@media (max-width: 640px) {
    .error-master-box-wrapper {
        padding: 40px 24px;
        border-radius: 16px;
    }
    .token-number-glitch { font-size: 5rem; letter-spacing: -2px; }
    .token-offset-backing { width: 110px; height: 60px; transform: rotate(-6deg) translate(-6px, 2px); }
    .error-content-narrative h2 { font-size: 1.6rem; }
    .error-content-narrative p { font-size: 0.92rem; }
    
    /* Flatten parallel action rows into clean stacked vertical configurations over mobile smartphones */
    .error-action-controls-row {
        flex-direction: column;
        gap: 12px;
    }
    .err-btn {
        width: 100%;
        padding: 14px;
    }
}

    </style>
</body>
</html>
